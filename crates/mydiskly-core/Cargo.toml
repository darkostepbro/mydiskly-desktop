[package]
name = "mydiskly-core"
version = "1.1.2026"
edition = "2021"
authors = ["Darkostepbro <serojalabs.sbs>", "Collaboration with Smart AI"]
description = "Core native Windows telemetry, SMART diagnostics, and system utilities for MyDiskly"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Security",
]
