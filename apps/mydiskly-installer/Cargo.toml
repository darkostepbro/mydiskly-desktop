[package]
name = "mydiskly-installer"
version = "1.1.2026"
edition = "2021"
authors = ["Darkostepbro <serojalabs.sbs>", "Collaboration with Smart AI"]
description = "MyDiskly Custom Zero-Dependency Desktop Bootstrapper Installer"

[[bin]]
name = "MyDiskly-Setup"
path = "src/main.rs"

[dependencies]
mydiskly-core = { path = "../../crates/mydiskly-core" }
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
winreg = "0.52"
serde_json = "1.0"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
]
