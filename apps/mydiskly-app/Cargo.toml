[package]
name = "mydiskly-app"
version = "1.1.2026"
edition = "2021"
authors = ["Darkostepbro <serojalabs.sbs>", "Collaboration with Smart AI"]
description = "MyDiskly Windows 11 & 10 Modern Fluent Storage Suite (Pure Native Rust GUI Edition)"

[[bin]]
name = "MyDiskly"
path = "src/main.rs"

[dependencies]
mydiskly-core = { path = "../../crates/mydiskly-core" }
eframe = { version = "0.29", default-features = false, features = ["glow"] }
egui = "0.29"
egui_plot = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"

[dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Registry",
]
